<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AJcreatives | Creative Video Editor & Interactive Designer - Premium Portfolio</title>
  <meta content="Highly polished portfolio of AJcreatives, specialized in creative post-production, branding, and motion design. Capturing kinetic and immersive scrolling visuals." name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">

  <!-- CDNs for styling & animations -->
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.17/dist/lenis.css">
  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#0D0D0D',
            cream: '#FAF9F6',
            electric: '#2E54FE',
            peach: '#FFBC95',
          },
          fontFamily: {
            heading: ['"Bricolage Grotesque"', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['"Share Tech Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- HTML Import Maps for cleaner ESM imports -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4",
        "@splinetool/runtime": "https://esm.sh/@splinetool/runtime@1.9.0"
      }
    }
  </script>

  <!-- Babel Standalone (Client-Side JSX Compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lenis Smooth Scrolling library -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.17/dist/lenis.min.js"></script>
</head>
<body class="bg-dark text-cream selection:bg-peach selection:text-dark">

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- React Logic (Transpiled client-side by Babel) -->
  <script 
    type="text/babel" 
    data-type="module" 
    data-presets="react" 
    src="app.js">
  </script>
</body>
</html>
